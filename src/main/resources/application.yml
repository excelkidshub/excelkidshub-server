# ============================================================
# application.yml — Shared base configuration
# ============================================================
# This file defines STRUCTURE only. No secrets, no environment-
# specific values. All sensitive values use ${ENV_VAR} placeholders.
#
# Active profiles:
#   local dev  : --spring.profiles.active=dev
#   production : --spring.profiles.active=prod
# ============================================================

spring:
  application:
    name: excelkidshub-platform

  # ── Database ──────────────────────────────────────────────
  datasource:
    driver-class-name: org.postgresql.Driver
    url:      ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: ExcelKidsHubPool
      maximum-pool-size: 5          # Keep low — Oracle Always Free has limited RAM
      minimum-idle: 1
      idle-timeout: 300000          # 5 min
      connection-timeout: 30000     # 30 sec
      max-lifetime: 1800000         # 30 min (must be < Neon's idle timeout)
      connection-test-query: SELECT 1

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    open-in-view: false             # Disable OSIV — avoids lazy-load surprises
    show-sql: false
    hibernate:
      ddl-auto: validate            # Never alter schema automatically in any env
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # ── Flyway migrations ─────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true       # Fail fast if migration checksums don't match
    out-of-order: false

  # ── Spring MVC ────────────────────────────────────────────
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher  # Required for /**/check slug endpoints

  # ── Email (SMTP) ──────────────────────────────────────────
  mail:
    host:     ${MAIL_HOST:smtp.gmail.com}
    port:     ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

# ── Server ────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  tomcat:
    max-threads: 20                 # Conservative for 1 GB RAM E2.1.Micro VM
    min-spare-threads: 2
    connection-timeout: 20000
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain
    min-response-size: 2048

# ── Logging ───────────────────────────────────────────────────
logging:
  level:
    root: WARN
    in.excelkidshub.platform: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ── App custom properties ─────────────────────────────────────
app:
  jwt:
    secret:     ${JWT_SECRET}           # Required — no default. Min 256-bit hex string.
    expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds

  razorpay:
    key-id:        ${RAZORPAY_KEY_ID}
    key-secret:    ${RAZORPAY_KEY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

  frontend:
    main-url: ${FRONTEND_MAIN_URL:https://excelkidshub.in}
    read-url:  ${FRONTEND_READ_URL:https://read.excelkidshub.in}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://excelkidshub.in,https://read.excelkidshub.in}

  mail:
    from:      ${MAIL_FROM:noreply@excelkidshub.in}
    from-name: ${MAIL_FROM_NAME:ExcelKidsHub}

# ── SpringDoc / Swagger ──────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: false
